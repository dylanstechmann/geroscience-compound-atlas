[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gerosci-atlas"
version = "0.1.0"
description = "Reproducible geroscience compound atlas and predictive benchmark"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Dylan Stechmann" }
]
license = { text = "MIT" }
dependencies = [
    "rdkit>=2023.9.1",
    "pydantic>=2.5.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0.1",
    "httpx>=0.25.0",
    "pyarrow>=14.0.0",
    "matplotlib>=3.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
