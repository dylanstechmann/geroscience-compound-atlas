name: tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-ci.txt -e '.[dev]'
      - name: Run unit tests
        run: python -m pytest tests/ -q
      - name: Verify research snapshot and published page
        working-directory: studies/research-decisions-2026-10-09
        run: |
          python -m unittest test_catalog test_site -v
          python build_site.py --check
